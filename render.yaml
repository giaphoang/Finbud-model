services:
  - type: web
    name: finbud-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_ID
        sync: false
      - key: QDRANT_CLOUD_URL
        sync: false
      - key: QDRANT_APIKEY
        sync: false 
      - key: USE_QDRANT_CLOUD
        sync: false
    # Add health check path
    healthCheckPath: /api/health
    # Enable auto-deploy from main branch
    autoDeploy: true
    # Add scaling configuration
    scaling:
      minInstances: 1
      maxInstances: 1